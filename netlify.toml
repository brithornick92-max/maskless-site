[build]
  publish = "."

# ---------- Security headers ----------
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# ---------- Caching ----------
# Long cache for versioned assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store"

# ---------- Redirects ----------
# Force HTTPS (Netlify handles cert) and canonical to apex
[[redirects]]
  from = "http://www.masklessapp.com/*"
  to = "https://masklessapp.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://masklessapp.com/*"
  to = "https://masklessapp.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.masklessapp.com/*"
  to = "https://masklessapp.com/:splat"
  status = 301
  force = true
